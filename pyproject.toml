[project]
name = "app"
version = "0.1.0"
description = "This project demonstrates the design of a backend application using FastAPI, combined with DevOps practices such as CI/CD automation, containerization and infrastructure provisioning using Ansible."
authors = [
    { name = "Amanda de Oliveira", email = "amanda.londrina.pr@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14"

packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
fastapi = "^0.135.1"
uvicorn = { extras = ["standard"], version = "^0.42.0" }
pydantic = "^2.12.5"
pydantic-settings = "^2.13.1"
tortoise-orm = "^1.1.6"
httpx = "^0.28.1"
structlog = "^25.5.0"
faker = "^40.11.0"


[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::tortoise.warnings.TortoiseLoopSwitchWarning"
]

[tool.poetry.scripts]
seed = "app.scripts.run_seed:run"